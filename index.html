<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1D2B4F">
  <title>Radio Betel</title>
  <meta name="description" content="Radio online al Bisericii Betel Constanța: Muzică și Predici.">
  <link rel="icon" type="image/png" href="../favicon-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=Literata:opsz,wght@7..72,500;7..72,700&display=swap" rel="stylesheet">
  <!--
    Radio Betel – pagină statică (GitHub Pages), fără server de streaming.
    Fiecare canal e un playlist (muzica.json / predici.json) cu fișiere MP3 găzduite gratuit (Internet Archive).
    „Radio”: poziția de redare se calculează din ceas (ora curentă față de `start` din playlist), deci toți
    ascultătorii aud același lucru în același moment, ca la un post de radio.
    Parametri: ?canal=muzica|predici  ·  ?compact=1 (variantă mică, pentru înglobare în Caietul de ucenicie)
  -->
  <style>
    :root {
      --page: #E8ECF2; --sheet: #FCFDFE; --ink: #1D2B4F; --ink-2: #4A5878; --ink-3: #6B7792; --line: #C8D1DF; --rule: #D3DAE6;
      --navy: #1D2B4F; --navy-2: #2A3B66; --sprout: #3F6E2C; --sprout-fill: #5E8C45; --sprout-wash: #E3EDDC; --danger: #A3352A;
      --focus: #2F62CC; --tint: rgba(29, 43, 79, .07); --on-navy: #FFFFFF; --on-navy-2: #C9D3E8;
      --serif: 'Literata', Georgia, serif; --sans: 'Atkinson Hyperlegible Next', 'Segoe UI', system-ui, -apple-system, sans-serif;
      --radius: 14px; color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --page: #0F1626; --sheet: #161F33; --ink: #E3E8F1; --ink-2: #A9B3C7; --ink-3: #8590A8; --line: #2B3651; --rule: #26314A;
        --navy: #0B1222; --navy-2: #1A2540; --sprout: #A5CF88; --sprout-fill: #7FAF62; --sprout-wash: #1F2E24; --danger: #F2988A;
        --focus: #8FB0FF; --tint: rgba(227, 232, 241, .08); color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --page: #0F1626; --sheet: #161F33; --ink: #E3E8F1; --ink-2: #A9B3C7; --ink-3: #8590A8; --line: #2B3651; --rule: #26314A;
      --navy: #0B1222; --navy-2: #1A2540; --sprout: #A5CF88; --sprout-fill: #7FAF62; --sprout-wash: #1F2E24; --danger: #F2988A;
      --focus: #8FB0FF; --tint: rgba(227, 232, 241, .08); color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    html { background: var(--page); }
    body { min-height: 100vh; }
    body { background: var(--page); color: var(--ink); font: 17px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
    button { font: inherit; color: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    [hidden] { display: none !important; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px calc(24px + env(safe-area-inset-bottom, 0px)); }

    header.top { background: var(--navy); color: var(--on-navy); padding: calc(18px + env(safe-area-inset-top, 0px)) 0 64px; }
    header.top .wrap { padding-bottom: 0; display: flex; align-items: center; gap: 12px; }
    .brand { flex: 1; min-width: 0; }
    .brand h1 { margin: 0; font: 700 1.5rem/1.15 var(--serif); letter-spacing: -.01em; }
    .brand p { margin: 2px 0 0; color: var(--on-navy-2); font-size: .9375rem; }
    .onair { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; background: rgba(255,255,255,.1); font-size: .8125rem; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    .onair i { width: 8px; height: 8px; border-radius: 50%; background: #E5372B; box-shadow: 0 0 0 0 rgba(229,55,43,.6); }
    .playing .onair i { animation: pulse 1.6s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(229,55,43,.6); } 70% { box-shadow: 0 0 0 8px rgba(229,55,43,0); } 100% { box-shadow: 0 0 0 0 rgba(229,55,43,0); } }
    @media (prefers-reduced-motion: reduce) { .playing .onair i { animation: none; } }

    .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 6px; margin: -44px 0 14px; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 10px 30px -18px rgba(29,43,79,.45); position: relative; }
    .tab { min-height: 48px; border: 0; border-radius: 10px; background: transparent; font-weight: 700; color: var(--ink-2); display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tab svg { width: 20px; height: 20px; }
    .tab[aria-selected="true"] { background: var(--navy-2); color: #fff; }

    .card { background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
    .now { display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center; }
    .play { width: 76px; height: 76px; border-radius: 50%; border: 0; background: var(--sprout-fill); color: #fff; display: grid; place-items: center; box-shadow: 0 8px 20px -10px rgba(63,110,44,.8); }
    .play svg { width: 34px; height: 34px; }
    .play:active { transform: scale(.97); }
    .play[aria-busy="true"] svg { opacity: .55; }
    .label { margin: 0; font-size: .8125rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
    .title { margin: 2px 0 0; font: 700 1.25rem/1.25 var(--serif); overflow-wrap: anywhere; }
    .meta { margin: 2px 0 0; color: var(--ink-2); font-size: .9375rem; overflow-wrap: anywhere; }
    .bar { margin-top: 18px; }
    .track { height: 6px; border-radius: 3px; background: var(--rule); overflow: hidden; }
    .track b { display: block; height: 100%; width: 0; background: var(--sprout-fill); }
    .times { display: flex; justify-content: space-between; margin-top: 6px; font-size: .8125rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    .btn { min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); background: transparent; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; }
    .btn svg { width: 18px; height: 18px; }
    .btn.primary { background: var(--navy-2); border-color: var(--navy-2); color: #fff; }
    .vol { display: flex; align-items: center; gap: 8px; margin-left: auto; color: var(--ink-3); }
    .vol input { width: 120px; accent-color: var(--sprout-fill); }
    @media (pointer: coarse) { .vol { display: none; } }
    .notice { margin: 12px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--tint); color: var(--ink-2); font-size: .9375rem; }
    .notice.err { color: var(--danger); }

    h2 { margin: 26px 0 8px; font-size: .875rem; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); }
    ol.list { list-style: none; margin: 0; padding: 0; background: var(--sheet); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    ol.list li + li { border-top: 1px solid var(--rule); }
    .item { width: 100%; display: grid; grid-template-columns: 56px 1fr auto; gap: 10px; align-items: center; padding: 10px 14px; min-height: 60px; border: 0; background: transparent; text-align: left; }
    button.item:hover { background: var(--tint); }
    .item .at { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: .875rem; }
    .item .t { font-weight: 700; overflow-wrap: anywhere; }
    .item .s { display: block; font-weight: 400; color: var(--ink-2); font-size: .875rem; }
    .item .d { color: var(--ink-3); font-size: .8125rem; font-variant-numeric: tabular-nums; }
    .item.cur { background: var(--sprout-wash); }
    .item.cur .at { color: var(--sprout); font-weight: 700; }
    .search { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--sheet); color: var(--ink); font: inherit; margin-bottom: 8px; }
    footer { margin-top: 28px; color: var(--ink-3); font-size: .8125rem; text-align: center; }
    footer a { color: inherit; }

    /* varianta compactă (înglobată în Caietul de ucenicie) */
    .compact header.top { padding: 12px 0 52px; }
    .compact .brand h1 { font-size: 1.125rem; }
    .compact .brand p, .compact footer, .compact .archive, .compact h2.prog, .compact ol.prog { display: none; }
    .compact .tabs { margin-top: -40px; }
  </style>
</head>
<body>
  <header class="top">
    <div class="wrap">
      <div class="brand">
        <h1>Radio Betel</h1>
        <p>Biserica Betel Constanța</p>
      </div>
      <span class="onair" aria-hidden="true"><i></i>Live</span>
    </div>
  </header>

  <main class="wrap">
    <div class="tabs" role="tablist" aria-label="Canale">
      <button class="tab" role="tab" id="tab-muzica" data-canal="muzica" aria-controls="panel" aria-selected="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>Muzică</button>
      <button class="tab" role="tab" id="tab-predici" data-canal="predici" aria-controls="panel" aria-selected="false" tabindex="-1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>Predici</button>
    </div>

    <section id="panel" role="tabpanel" aria-labelledby="tab-muzica">
      <div class="card" aria-live="polite">
        <div class="now">
          <button class="play" id="play" type="button" aria-label="Pornește radioul">
            <svg id="ic-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg id="ic-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
          </button>
          <div>
            <p class="label" id="mode">Acum în direct</p>
            <p class="title" id="title">Se încarcă…</p>
            <p class="meta" id="meta"></p>
          </div>
        </div>
        <div class="bar" aria-hidden="true">
          <div class="track"><b id="progress"></b></div>
          <div class="times"><span id="elapsed">0:00</span><span id="total">0:00</span></div>
        </div>
        <div class="row">
          <button class="btn primary" id="golive" type="button" hidden>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="2"/><path d="M16.2 7.8a6 6 0 0 1 0 8.4M7.8 16.2a6 6 0 0 1 0-8.4M19 5a10 10 0 0 1 0 14M5 19A10 10 0 0 1 5 5"/></svg>Revino la radio</button>
          <span id="next" class="meta"></span>
          <label class="vol">Volum <input id="vol" type="range" min="0" max="1" step="0.05" value="1" aria-label="Volum"></label>
        </div>
        <p class="notice" id="notice" hidden></p>
      </div>

      <h2 class="prog">Programul</h2>
      <ol class="list prog" id="prog"></ol>

      <div class="archive" id="archive" hidden>
        <h2>Arhiva predicilor</h2>
        <input class="search" id="q" type="search" placeholder="Caută după titlu, predicator sau dată" aria-label="Caută în arhivă" autocomplete="off">
        <ol class="list" id="arch"></ol>
      </div>
    </section>

    <footer>
      <p>Înregistrări ale Bisericii Betel Constanța · <a href="https://www.youtube.com/" id="yt" target="_blank" rel="noopener">Canalul de YouTube</a></p>
    </footer>
  </main>

  <audio id="audio" preload="none"></audio>

<script>
(function () {
  'use strict';
  var CANALE = {
    muzica: { fisier: 'muzica.json', nume: 'Muzică' },
    predici: { fisier: 'predici.json', nume: 'Predici' }
  };
  var LOGO = '../icon-512.png';
  var params = new URLSearchParams(location.search);
  if (params.get('compact') === '1') document.documentElement.classList.add('compact');
  // pe telefon volumul se reglează din butoanele aparatului (iOS ignoră oricum volumul din pagină)
  if (navigator.maxTouchPoints > 0 || matchMedia('(pointer: coarse)').matches) document.querySelector('.vol').hidden = true;

  var $ = function (id) { return document.getElementById(id); };
  var audio = $('audio');
  var st = { canal: CANALE[params.get('canal')] ? params.get('canal') : 'muzica', data: {}, idx: -1, live: true, want: false, fails: 0, seekTo: null };

  function fmt(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
    return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0');
  }
  function clock(d) { return d.toLocaleTimeString('ro-RO', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/Bucharest' }); }
  function dateRo(ymd) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(ymd || '');
    if (!m) return '';
    return new Date(Date.UTC(+m[1], +m[2] - 1, +m[3], 12)).toLocaleDateString('ro-RO', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
  }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function notice(text, err) { var n = $('notice'); n.hidden = !text; n.textContent = text || ''; n.classList.toggle('err', !!err); }

  /** Validează playlistul: doar adrese https și durate pozitive. */
  function clean(j) {
    var piese = (j && Array.isArray(j.piese) ? j.piese : []).filter(function (p) {
      return p && typeof p.titlu === 'string' && /^https:\/\//.test(p.url || '') && Number(p.durata) > 0;
    }).map(function (p) {
      return { titlu: p.titlu, autor: typeof p.autor === 'string' ? p.autor : '', data: typeof p.data === 'string' ? p.data : '', url: p.url, durata: Number(p.durata), sursa: /^https:\/\//.test(p.sursa || '') ? p.sursa : '' };
    });
    var start = Date.parse(j && j.start) || Date.UTC(2026, 0, 1);
    var total = piese.reduce(function (n, p) { return n + p.durata; }, 0);
    return { nume: (j && j.nume) || '', descriere: (j && j.descriere) || '', youtube: /^https:\/\//.test(j && j.youtube || '') ? j.youtube : '', piese: piese, start: start, total: total };
  }
  function load(canal) {
    if (st.data[canal]) return Promise.resolve(st.data[canal]);
    return fetch(CANALE[canal].fisier, { cache: 'no-cache' }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) { return (st.data[canal] = clean(j)); });
  }

  /** Poziția „în direct”: ce piesă se aude acum și de la ce secundă (aceeași pentru toți ascultătorii). */
  function livePos(d, at) {
    var t = (((at || Date.now()) - d.start) / 1000) % d.total;
    if (t < 0) t += d.total;
    for (var i = 0; i < d.piese.length; i++) {
      if (t < d.piese[i].durata) return { idx: i, pos: t };
      t -= d.piese[i].durata;
    }
    return { idx: 0, pos: 0 };
  }

  function cur() { var d = st.data[st.canal]; return d && d.piese[st.idx]; }
  function setPlayingUi(on) {
    document.body.classList.toggle('playing', on);
    $('ic-play').toggleAttribute('hidden', on); $('ic-pause').toggleAttribute('hidden', !on);   // SVG: atributul, nu proprietatea
    $('play').setAttribute('aria-label', on ? 'Oprește' : (st.live ? 'Pornește radioul' : 'Redă'));
  }
  function showNow() {
    var d = st.data[st.canal], p = cur();
    $('mode').textContent = st.live ? 'Acum în direct · ' + CANALE[st.canal].nume : 'Ascultare la cerere · ' + CANALE[st.canal].nume;
    $('golive').hidden = st.live;
    if (!p) { $('title').textContent = d && !d.piese.length ? 'Playlistul este gol' : 'Se încarcă…'; $('meta').textContent = ''; return; }
    $('title').textContent = p.titlu;
    $('meta').textContent = [p.autor, dateRo(p.data)].filter(Boolean).join(' · ');
    $('total').textContent = fmt(p.durata);
    var nx = st.live && d.piese.length > 1 ? d.piese[(st.idx + 1) % d.piese.length] : null;
    $('next').textContent = nx ? 'Urmează: ' + nx.titlu : '';
    if ('mediaSession' in navigator) {
      try {
        navigator.mediaSession.metadata = new MediaMetadata({ title: p.titlu, artist: p.autor || 'Biserica Betel Constanța', album: 'Radio Betel · ' + CANALE[st.canal].nume, artwork: [{ src: LOGO, sizes: '512x512', type: 'image/png' }] });
      } catch (e) { /* browser fără MediaMetadata */ }
    }
  }
  function tick() {
    var p = cur();
    if (!p) return;
    var t = audio.currentTime || 0;
    if (!st.want) {                                   // oprit: arătăm totuși unde a ajuns radioul
      if (st.live) { var lp = livePos(st.data[st.canal]); if (lp.idx !== st.idx) { st.idx = lp.idx; showNow(); drawProgram(); } t = lp.pos; }
      else t = st.seekTo != null ? st.seekTo : t;
    }
    $('elapsed').textContent = fmt(t);
    $('progress').style.width = Math.min(100, t / p.durata * 100) + '%';
  }

  /** Programul următoarelor piese, cu ora estimată de început. */
  function drawProgram() {
    var d = st.data[st.canal], ol = $('prog');
    ol.replaceChildren();
    if (!d || !d.piese.length) return;
    var lp = livePos(d), now = Date.now();
    var at = now - lp.pos * 1000;
    var n = Math.min(d.piese.length, 6);
    for (var k = 0; k < n; k++) {
      var i = (lp.idx + k) % d.piese.length, p = d.piese[i];
      var li = el('li'), row = el('div', 'item' + (k === 0 ? ' cur' : ''));
      row.append(el('span', 'at', k === 0 ? 'Acum' : clock(new Date(at))));
      var t = el('span', 't', p.titlu); if (p.autor) t.append(el('span', 's', p.autor));
      row.append(t, el('span', 'd', fmt(p.durata)));
      li.append(row); ol.append(li);
      at += p.durata * 1000;
    }
  }
  /** Arhiva (doar la Predici): oricare predică, la cerere, de la început. */
  function drawArchive() {
    var d = st.data[st.canal], box = $('archive'), ol = $('arch');
    box.hidden = st.canal !== 'predici' || !d || !d.piese.length;
    if (box.hidden) return;
    var q = $('q').value.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
    ol.replaceChildren();
    d.piese.map(function (p, i) { return { p: p, i: i }; }).sort(function (a, b) { return (b.p.data || '').localeCompare(a.p.data || ''); }).forEach(function (x) {
      var hay = (x.p.titlu + ' ' + x.p.autor + ' ' + x.p.data + ' ' + dateRo(x.p.data)).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
      if (q && hay.indexOf(q) < 0) return;
      var b = el('button', 'item' + (!st.live && st.idx === x.i ? ' cur' : ''));
      b.type = 'button';
      b.append(el('span', 'at', x.p.data ? x.p.data.slice(8, 10) + '.' + x.p.data.slice(5, 7) : ''));
      var t = el('span', 't', x.p.titlu); if (x.p.autor) t.append(el('span', 's', x.p.autor));
      b.append(t, el('span', 'd', fmt(x.p.durata)));
      b.addEventListener('click', function () { playOnDemand(x.i); });
      var li = el('li'); li.append(b); ol.append(li);
    });
    if (!ol.children.length) { var li = el('li'); li.append(el('div', 'item', 'Nicio predică găsită.')); ol.append(li); }
  }

  function startAt(idx, pos) {
    var d = st.data[st.canal], p = d.piese[idx];
    st.idx = idx; st.seekTo = pos;
    showNow(); drawProgram(); drawArchive();
    $('play').setAttribute('aria-busy', 'true');
    if (audio.getAttribute('src') !== p.url) { audio.src = p.url; audio.load(); }
    else if (audio.readyState >= 1) { try { audio.currentTime = pos; } catch (e) { /* */ } st.seekTo = null; }
    var pr = audio.play();
    if (pr && pr.catch) pr.catch(function (e) {
      if (e && e.name === 'NotAllowedError') { st.want = false; setPlayingUi(false); notice('Apasă butonul de redare ca să pornești radioul.'); }
    });
  }
  function playLive() {
    var d = st.data[st.canal];
    if (!d || !d.piese.length) return;
    st.live = true; st.want = true; notice('');
    var lp = livePos(d);
    startAt(lp.idx, lp.pos);
  }
  function playOnDemand(i) {
    st.live = false; st.want = true; notice('');
    startAt(i, 0);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  function stop() { st.want = false; audio.pause(); setPlayingUi(false); }

  audio.addEventListener('loadedmetadata', function () {
    if (st.seekTo != null) { try { audio.currentTime = Math.min(st.seekTo, Math.max(0, (audio.duration || st.seekTo) - 1)); } catch (e) { /* */ } st.seekTo = null; }
  });
  audio.addEventListener('playing', function () { st.fails = 0; $('play').removeAttribute('aria-busy'); setPlayingUi(true); notice(''); });
  audio.addEventListener('waiting', function () { $('play').setAttribute('aria-busy', 'true'); });
  audio.addEventListener('pause', function () { if (!st.want) setPlayingUi(false); });
  audio.addEventListener('timeupdate', tick);
  audio.addEventListener('ended', function () {
    if (!st.want) return;
    var d = st.data[st.canal];
    if (st.live) { var lp = livePos(d); if (lp.idx === st.idx) lp = { idx: (st.idx + 1) % d.piese.length, pos: 0 }; startAt(lp.idx, lp.pos); }
    else { st.want = false; setPlayingUi(false); st.live = true; showNow(); drawArchive(); notice('Predica s-a încheiat. Apasă redarea ca să revii la radio.'); }
  });
  audio.addEventListener('error', function () {
    if (!st.want) return;
    st.fails++;
    var d = st.data[st.canal];
    if (st.fails > Math.min(3, d.piese.length)) { stop(); notice('Înregistrările nu pot fi redate acum. Verifică conexiunea și încearcă din nou.', true); return; }
    notice('O înregistrare nu a putut fi redată; trecem la următoarea.', true);
    setTimeout(function () { if (st.want) startAt((st.idx + 1) % d.piese.length, 0); }, 1500);
  });

  $('play').addEventListener('click', function () {
    if (st.want) { stop(); return; }
    if (st.live) playLive(); else { st.want = true; startAt(st.idx, audio.currentTime || 0); }
  });
  $('golive').addEventListener('click', playLive);
  $('vol').addEventListener('input', function () { audio.volume = Number(this.value); });
  $('q').addEventListener('input', drawArchive);
  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', function () { if (!st.want) $('play').click(); });
      navigator.mediaSession.setActionHandler('pause', function () { if (st.want) stop(); });
    } catch (e) { /* */ }
  }

  function selectTab(canal, focus) {
    var was = st.want;
    if (was) { st.want = false; audio.pause(); }
    st.canal = canal; st.live = true; st.idx = -1;
    document.querySelectorAll('.tab').forEach(function (t) {
      var on = t.dataset.canal === canal;
      t.setAttribute('aria-selected', String(on)); t.tabIndex = on ? 0 : -1;
      if (on && focus) t.focus();
    });
    $('panel').setAttribute('aria-labelledby', 'tab-' + canal);
    var u = new URL(location.href); u.searchParams.set('canal', canal); history.replaceState(null, '', u);
    showNow(); notice('');
    load(canal).then(function (d) {
      if (st.canal !== canal) return;
      if (d.youtube) $('yt').href = d.youtube;
      if (!d.piese.length) { showNow(); drawProgram(); drawArchive(); notice('Încă nu există înregistrări pe acest canal.'); return; }
      var lp = livePos(d); st.idx = lp.idx;
      showNow(); drawProgram(); drawArchive(); tick();
      if (was) playLive(); else setPlayingUi(false);
    }).catch(function () { if (st.canal === canal) { $('title').textContent = 'Canalul nu este disponibil'; notice('Playlistul nu a putut fi încărcat. Încearcă din nou în câteva minute.', true); } });
  }
  document.querySelectorAll('.tab').forEach(function (t) {
    t.addEventListener('click', function () { if (t.dataset.canal !== st.canal) selectTab(t.dataset.canal); });
    t.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      e.preventDefault(); selectTab(st.canal === 'muzica' ? 'predici' : 'muzica', true);
    });
  });
  setInterval(function () { if (!st.want) { tick(); } if (st.live) drawProgram(); }, 15000);
  setInterval(tick, 1000);
  selectTab(st.canal);
})();
</script>
</body>
</html>
